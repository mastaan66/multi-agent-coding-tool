<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AI Software Factory architecture</title>
  <desc id="desc">A request flows through planning, coding, review, testing, and deployment agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#091326"/>
      <stop offset="1" stop-color="#102c3a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5dd9ff"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#eefaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Seven-stage generation pipeline</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(55 115)">
      <rect width="190" height="92" rx="18" fill="#163b56" stroke="#5dd9ff" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1. Planner</text>
      <text x="95" y="67" text-anchor="middle" fill="#b6d8e7" font-size="15">Architecture + contracts</text>
    </g>
    <g transform="translate(300 115)">
      <rect width="190" height="92" rx="18" fill="#173f52" stroke="#63e4cf" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2. Coder</text>
      <text x="95" y="67" text-anchor="middle" fill="#b9e8df" font-size="15">Complete source files</text>
    </g>
    <g transform="translate(545 115)">
      <rect width="190" height="92" rx="18" fill="#33375d" stroke="#a8b0ff" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3. Reviewer</text>
      <text x="95" y="67" text-anchor="middle" fill="#d4d8ff" font-size="15">Quality + security</text>
    </g>
    <g transform="translate(790 115)">
      <rect width="190" height="92" rx="18" fill="#4b3455" stroke="#ef9cff" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4. Improver</text>
      <text x="95" y="67" text-anchor="middle" fill="#f4ccfb" font-size="15">Focused corrections</text>
    </g>
    <g transform="translate(790 315)">
      <rect width="190" height="92" rx="18" fill="#4c3e26" stroke="#ffd36a" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5. Tester</text>
      <text x="95" y="67" text-anchor="middle" fill="#f5deb0" font-size="15">Automated test suite</text>
    </g>
    <g transform="translate(545 315)">
      <rect width="190" height="92" rx="18" fill="#4a2f34" stroke="#ff9d9d" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6. Test Runner</text>
      <text x="95" y="67" text-anchor="middle" fill="#ffd1d1" font-size="15">Execute + diagnose</text>
    </g>
    <g transform="translate(300 315)">
      <rect width="190" height="92" rx="18" fill="#214630" stroke="#70ed9d" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">7. Deployer</text>
      <text x="95" y="67" text-anchor="middle" fill="#c9f7d9" font-size="15">Docker + CI/CD</text>
    </g>
    <g transform="translate(55 315)">
      <rect width="190" height="92" rx="18" fill="#17334c" stroke="#66baff" stroke-width="2"/>
      <text x="95" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Output</text>
      <text x="95" y="67" text-anchor="middle" fill="#c4ddf2" font-size="15">Ready-to-run project</text>
    </g>
  </g>
  <g fill="none" stroke="#5dd9ff" stroke-width="4" marker-end="url(#arrow)">
    <path d="M245 161h48"/>
    <path d="M490 161h48"/>
    <path d="M735 161h48"/>
    <path d="M885 207v101"/>
    <path d="M790 361h-48"/>
    <path d="M545 361h-48"/>
    <path d="M300 361h-48"/>
  </g>
  <path d="M885 407v90H640v-83" fill="none" stroke="#ff9d9d" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="758" y="528" text-anchor="middle" fill="#ffc1c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">failed tests return to improvement</text>
  <path d="M885 115V78H640v30" fill="none" stroke="#ef9cff" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="760" y="84" text-anchor="middle" fill="#f2c5fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">review feedback loop</text>
  <text x="600" y="602" text-anchor="middle" fill="#a8c7d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Deterministic demo mode • typed state • bounded retries • validated output paths</text>
</svg>
