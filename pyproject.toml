[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-factory"
version = "0.3.0"
description = "AI Software Factory - Multiple specialized agents collaborating like a real engineering team"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.86.0,<2",
    "openai>=1.50.0,<3",
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
    "rich>=13.0.0,<15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]
release = [
    "pyinstaller>=6.10,<7",
]

[project.scripts]
ai-factory = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
no_site_packages = true
files = [
    "src/core/config.py",
    "src/core/events.py",
    "src/core/context.py",
    "src/core/errors.py",
    "src/core/instructions.py",
    "src/core/models.py",
    "src/core/repository.py",
    "src/core/runtime.py",
    "src/harness",
    "src/providers",
    "src/tools",
    "src/sessions",
]
check_untyped_defs = true
ignore_missing_imports = true
pretty = true
