name: Feature request
description: Propose a focused product improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI and terminal UX
        - Agents and orchestration
        - Safety and sandboxing
        - Providers and models
        - Packaging and installation
        - Documentation
        - Other
    validations:
      required: true
