name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            executable: dist/ai-factory
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            executable: dist/ai-factory
          - os: macos-15
            platform: macos
            arch: arm64
            executable: dist/ai-factory
          - os: windows-latest
            platform: windows
            arch: x86_64
            executable: dist/ai-factory.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[release]"
      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name ai-factory \
            --collect-all crewai \
            --copy-metadata ai-software-factory \
            src/main.py
      - name: Package executable
        run: >-
          python scripts/package_release.py
          --binary "${{ matrix.executable }}"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ai-factory-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
